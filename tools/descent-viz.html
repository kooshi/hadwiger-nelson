<script>
const D = JSON.parse(document.getElementById('descentdata').textContent);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let T = {s: 120, x: 0, y: 0}, drag = null, sel = null;
const P = D.points || [], byI = P;
const depthCol = d => ['#f2f2f2','#4fc3f7','#66bb6a','#ffee58','#ff7043','#ab47bc','#26c6da','#8d6e63'][Math.min(d,7)];
const $ = id => document.getElementById(id);
document.getElementById('title').textContent = 'descent object · ' + (D.label||'');
if (D.counts) $('counts').innerHTML = `${D.n} points (${D.seed_n} seed, ${D.deleted.length} deleted, ${D.n - D.seed_n} halo, max depth ${D.counts.max_depth})<br>${D.counts.unit} unit edges · ${D.counts.cheats} cheats · floor ${D.counts.floor} · put back ${D.counts.putback} · removed ${D.counts.removed}<br>forced pair ${D.forced[0]}–${D.forced[1]} · fp ${D.fingerprint}`;
function resize(){ cv.width = cv.clientWidth; cv.height = cv.clientHeight; draw(); }
const W = p => [T.x + p.x * T.s, T.y - p.y * T.s];
function fitTo(pts){ if(!pts.length) return; let xs=pts.map(p=>p.x), ys=pts.map(p=>p.y); const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  T.s = 0.9*Math.min(cv.width/(x1-x0+1e-9), cv.height/(y1-y0+1e-9)); T.x = cv.width/2 - (x0+x1)/2*T.s; T.y = cv.height/2 + (y0+y1)/2*T.s; draw(); }
function edgeSet(list){ const s=new Set(); for(const [u,v] of list) s.add(u<v?u+'-'+v:v+'-'+u); return s; }
const floorS = edgeSet(D.floor||[]), putS = edgeSet(D.putback||[]), remS = edgeSet(D.removed||[]);
function visible(p){ if(p.kind==='seed') return $('pseed').checked; if(p.kind==='seed-deleted') return $('pdel').checked; return $('phalo').checked && p.depth <= +$('maxdepth').value; }
function drawEdges(list, color, width, dash){ ctx.strokeStyle=color; ctx.lineWidth=width; ctx.setLineDash(dash||[]); ctx.beginPath();
  for(const [u,v] of list){ const a=P[u], b=P[v]; if(!visible(a)||!visible(b)) continue; const [ax,ay]=W(a),[bx,by]=W(b); ctx.moveTo(ax,ay); ctx.lineTo(bx,by);} ctx.stroke(); ctx.setLineDash([]); }
function draw(){
  ctx.fillStyle='#111'; ctx.fillRect(0,0,cv.width,cv.height);
  if($('eunit').checked) drawEdges(D.unit, '#444', 0.6);
  if($('erem').checked) drawEdges(D.removed, '#42a5f5', 1, [4,3]);
  if($('echeat').checked) drawEdges((D.cheats||[]).filter(([u,v])=>!floorS.has(u<v?u+'-'+v:v+'-'+u)), '#ffa726', 1);
  if($('efloor').checked) drawEdges(D.floor, '#ef5350', 2);
  if($('eput').checked) drawEdges(D.putback, '#e040fb', 3);
  for(const p of P){ if(!visible(p)) continue; const [x,y]=W(p); const r = p.kind==='halo'?2.2:3.5;
    ctx.beginPath(); ctx.arc(x,y,r,0,7);
    if(p.kind==='seed-deleted'){ ctx.strokeStyle='#888'; ctx.lineWidth=1; ctx.stroke(); } else { ctx.fillStyle = p.kind==='seed'?'#f2f2f2':depthCol(p.depth); ctx.fill(); } }
  for(const f of D.forced||[]){ const [x,y]=W(P[f]); ctx.strokeStyle='#ff1744'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,8,0,7); ctx.stroke(); ctx.fillStyle='#ff1744'; ctx.font='12px sans-serif'; ctx.fillText('forced '+f, x+10, y-8); }
  if(sel!==null){ const p=P[sel]; const [x,y]=W(p);
    if($('rings').checked){ ctx.setLineDash([3,3]); ctx.lineWidth=1; for(const [rr,c] of [[1,'#80cbc4'],[Math.sqrt(3),'#ce93d8'],[2,'#ffab91']]){ ctx.strokeStyle=c; ctx.beginPath(); ctx.arc(x,y,rr*T.s,0,7); ctx.stroke(); } ctx.setLineDash([]); }
    if($('nbrs').checked){ for(const [u,v] of D.unit){ if(u===sel||v===sel){ const q=P[u===sel?v:u]; const [qx,qy]=W(q); ctx.strokeStyle='#00e676'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(qx,qy); ctx.stroke(); ctx.fillStyle='#00e676'; ctx.beginPath(); ctx.arc(qx,qy,4,0,7); ctx.fill(); ctx.fillText(u===sel?v:u, qx+5, qy-5);} }
      for(const [u,v] of D.cheats){ if(u===sel||v===sel){ const q=P[u===sel?v:u]; const [qx,qy]=W(q); ctx.strokeStyle='#ffa726'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(qx,qy); ctx.stroke(); ctx.fillStyle='#ffa726'; ctx.fillText(u===sel?v:u, qx+5, qy+12);} } }
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,7,0,7); ctx.stroke(); }
}
function select(i){ sel=i; const p=P[i]; if(!p) return; const un=[],ch=[];
  for(const [u,v] of D.unit){ if(u===i) un.push(v); if(v===i) un.push(u); }
  for(const [u,v] of D.cheats){ if(u===i) ch.push(v); if(v===i) ch.push(u); }
  const tag = e => { const k=Math.min(i,e)+'-'+Math.max(i,e); return e+(floorS.has(k)?'·floor':'')+(putS.has(k)?'·put-back':''); };
  const rem=[]; for(const [u,v] of D.removed){ if(u===i) rem.push(v); if(v===i) rem.push(u); }
  $('info').textContent = `vertex ${i} (${p.kind}${p.kind==='halo'?', depth '+p.depth+', glue of '+p.parents.join(' & ')+' sign '+p.sign:''})\n(x, y) = (${p.x.toFixed(6)}, ${p.y.toFixed(6)})\nunit degree ${p.udeg}: ${un.sort((a,b)=>a-b).join(' ')}\ncheats (${ch.length}): ${ch.map(tag).join(' ')}\nremoved cheats here (${rem.length}): ${rem.join(' ')}\n|to forced ${D.forced[0]}| = ${Math.hypot(p.x-P[D.forced[0]].x,p.y-P[D.forced[0]].y).toFixed(4)}  |to ${D.forced[1]}| = ${Math.hypot(p.x-P[D.forced[1]].x,p.y-P[D.forced[1]].y).toFixed(4)}`; draw(); }
cv.onmousedown = e => { drag={x:e.clientX,y:e.clientY,tx:T.x,ty:T.y,moved:false}; };
window.onmousemove = e => { if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true; T.x=drag.tx+dx; T.y=drag.ty+dy; draw(); };
window.onmouseup = e => { if(drag && !drag.moved){ const r=cv.getBoundingClientRect(); const mx=e.clientX-r.left, my=e.clientY-r.top; let best=null,bd=64;
    for(const p of P){ if(!visible(p)) continue; const [x,y]=W(p); const d=(x-mx)**2+(y-my)**2; if(d<bd){bd=d;best=p.i;} } if(best!==null) select(best); } drag=null; };
cv.onwheel = e => { e.preventDefault(); const r=cv.getBoundingClientRect(); const mx=e.clientX-r.left, my=e.clientY-r.top; const f=Math.exp(-e.deltaY*0.0015); T.x = mx - (mx-T.x)*f; T.y = my - (my-T.y)*f; T.s*=f; draw(); };
for(const id of ['pseed','pdel','phalo','maxdepth','eunit','echeat','efloor','eput','erem','rings','nbrs']) $(id).onchange = draw;
$('go').onclick = () => select(+$('sel').value); $('sel').onkeydown = e => { if(e.key==='Enter') select(+$('sel').value); };
$('fit').onclick = () => fitTo(P.filter(visible)); $('fitseed').onclick = () => fitTo(P.filter(p=>p.kind!=='halo'));
window.onresize = resize; resize(); fitTo(P.filter(p=>p.kind!=='halo'));
</script>
